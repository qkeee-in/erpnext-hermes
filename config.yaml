model:
  default: openrouter/auto-beta
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
checkpoints:
  enabled: true
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
agent:
  max_turns: 50
web:
  backend: tavily
  use_gateway: false
browser:
  cloud_provider: local
  use_gateway: false
display:
  tool_progress: all
dashboard:
  basic_auth:
    username: ""
    password_hash: ""
    secret: ""
tts:
  use_gateway: false
# command_allowlist intentionally empty. Hermes's actual schema (see
# website/docs/user-guide/security.md "Permanent Allowlist") expects
# literal command patterns/globs here (e.g. "rm", "git push *") that get
# silently pre-approved past the dangerous-command approval gate. This
# used to hold "execute_code" / "script execution via heredoc" / "script
# execution via -e/-c flag" — descriptive prose, not command patterns,
# so those entries never matched anything and were dead config. Removed
# 2026-08-23 (adversarial-review follow-up) rather than left in place,
# since a stray real pattern added here later next to bogus-looking
# entries could plausibly go unnoticed on review. Every
# `python scripts/erp_client.py mutate ...` invocation should go through
# Hermes's normal dangerous-command approval flow, on top of (not
# instead of) this library's own advisory-first/confirmation-token gate.
command_allowlist: []
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
    profile_build_offered: true
_config_version: 33
session_reset:
  mode: none
image_gen:
  provider: openrouter
  use_gateway: false
  model: openai/gpt-5.4-image-2
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  discord:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
  discord:
    - spotify
platforms:
  discord:
    enabled: true
  google_chat:
    enabled: true
# `terminal.cwd` intentionally omitted: a hardcoded absolute dev-machine
# path here (this file is `distribution_owned`, shipped to every install)
# would be Hermes's own documented "machine-local path" anti-pattern —
# see website/docs/user-guide/skills/bundled/software-development/
# software-development-hermes-agent-skill-authoring.md, "Never use
# machine-local paths". Omitting the key lets Hermes fall back to
# TERMINAL_CWD / the profile's actual process cwd (terminal_tool.py),
# which is portable across installs. Set TERMINAL_CWD in the environment
# instead if a fixed working directory is needed on a given machine.
terminal:
  backend: local
approvals:
  destructive_slash_confirm: true
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: "tirith"
  tirith_timeout: 5
  tirith_fail_open: true

